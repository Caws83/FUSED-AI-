[profile.default]
src = "src"
out = "out"
libs = ["lib", "../upstream/openlaunch/contracts/lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read", path = "../upstream/openlaunch/contracts/lib" },
]

[fmt]
line_length = 120
tab_width = 4
