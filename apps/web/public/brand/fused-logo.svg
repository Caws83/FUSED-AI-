    </linearGradient>
    <linearGradient id="logo-base" x1="70" y1="180" x2="190" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="logo-fused" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A4A4A"/>
      <stop offset="0.45" stop-color="#B8864A"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logo-soft">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#071422" flood-opacity="0.18"/>
    </filter>
    <filter id="logo-type">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#071422" flood-opacity="0.12"/>
    </filter>
  </defs>

