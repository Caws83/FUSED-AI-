<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-label="FUSED AI">
  <title>FUSED AI</title>
  <defs>
    <linearGradient id="logo-ring-l" x1="40" y1="20" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8FF4A"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="logo-ring-r" x1="140" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="logo-brain" x1="90" y1="100" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
