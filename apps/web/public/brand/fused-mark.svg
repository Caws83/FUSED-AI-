<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Fused AI">
  <title>Fused AI mark</title>
  <defs>
    <linearGradient id="fa-ring-l" x1="40" y1="20" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8FF4A"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fa-ring-r" x1="140" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fa-brain" x1="90" y1="100" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="fa-base" x1="70" y1="180" x2="190" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="fa-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fa-soft">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#071422" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ring: green/cyan left, cyan/blue right, open at the base -->
  <g fill="none" stroke-linecap="round">
    <path d="M57.3 194.7A100 100 0 0 1 128 24" stroke="url(#fa-ring-l)" stroke-width="20"/>
    <path d="M198.7 194.7A100 100 0 0 0 128 24" stroke="url(#fa-ring-r)" stroke-width="20"/>
  </g>

  <!-- launch pad / crystalline base -->
  <path fill="url(#fa-base)" d="M68 220 104 174l24 26 24-30 36 50c-24 12-88 12-120 0Z"/>

  <!-- neural brain -->
  <g filter="url(#fa-glow)">
    <path fill="url(#fa-brain)" d="M128 104c-22-12-48-4-52 22-4 24 12 44 36 48 6 2 10-4 12-10 2 6 6 12 12 10 24-4 40-24 36-48-4-26-30-34-44-22z"/>
    <g fill="none" stroke="#E0E7FF" stroke-width="1.7" stroke-linecap="round" opacity="0.9">
      <path d="M96 126 112 118 128 128 144 116 160 126"/>
      <path d="M92 140 110 136 128 148 146 136 164 142"/>
      <path d="M108 156 128 148 148 156"/>
      <path d="M112 118 110 136 108 156"/>
      <path d="M144 116 146 136 148 156"/>
      <path d="M128 112 128 128 128 148"/>
    </g>
    <g fill="#fff">
      <circle cx="96" cy="126" r="3.1"/>
      <circle cx="112" cy="118" r="3.4"/>
      <circle cx="144" cy="116" r="3.5"/>
      <circle cx="160" cy="126" r="3.2"/>
      <circle cx="92" cy="140" r="2.8"/>
      <circle cx="110" cy="136" r="3"/>
      <circle cx="128" cy="128" r="4.2" fill="#EEF2FF"/>
      <circle cx="146" cy="136" r="3"/>
      <circle cx="164" cy="142" r="2.9"/>
      <circle cx="108" cy="156" r="2.8"/>
      <circle cx="128" cy="148" r="3.2"/>
      <circle cx="148" cy="156" r="2.8"/>
      <circle cx="128" cy="112" r="3"/>
    </g>
  </g>

  <!-- circuit traces into the ring -->
  <g fill="none" stroke-linecap="round">
    <path d="M90 124H48" stroke="#4ADE80" stroke-width="3.2"/>
    <path d="M94 140H56" stroke="#22D3EE" stroke-width="2.6"/>
    <path d="M98 110H60" stroke="#86EFAC" stroke-width="2.4"/>
    <path d="M166 124h42" stroke="#38BDF8" stroke-width="3.2"/>
    <path d="M164 142h40" stroke="#60A5FA" stroke-width="2.6"/>
    <path d="M162 110h40" stroke="#7DD3FC" stroke-width="2.4"/>
    <circle cx="44" cy="124" r="4" fill="#4ADE80" stroke="none"/>
    <circle cx="52" cy="140" r="3.2" fill="#22D3EE" stroke="none"/>
    <circle cx="56" cy="110" r="3" fill="#86EFAC" stroke="none"/>
    <circle cx="212" cy="124" r="4" fill="#38BDF8" stroke="none"/>
    <circle cx="208" cy="142" r="3.2" fill="#60A5FA" stroke="none"/>
    <circle cx="206" cy="110" r="3" fill="#7DD3FC" stroke="none"/>
  </g>

  <!-- exhaust -->
  <path d="M150 102C140 124 134 146 136 168" fill="none" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <path d="M150 102C140 124 134 146 136 168" fill="none" stroke="#BFDBFE" stroke-width="3.2" stroke-linecap="round" opacity="0.5"/>

  <!-- rocket -->
  <g transform="translate(166 82) rotate(30)" filter="url(#fa-soft)">
    <path fill="#22C55E" d="M-14 12 -32 34 -8 22z"/>
    <path fill="#16A34A" d="M14 12 32 34 8 22z"/>
    <path fill="#fff" d="M0-38c10 0 15 11 15 24v30c0 8-7 13-15 13s-15-5-15-13V-14c0-13 5-24 15-24z"/>
    <path fill="#4ADE80" d="M0-42c8.5 0 13 9 13 18H-13c0-9 4.5-18 13-18z"/>
    <circle cx="0" cy="-10" r="7.4" fill="#38BDF8"/>
    <circle cx="-1.6" cy="-12.2" r="2.5" fill="#fff" opacity="0.75"/>
  </g>
</svg>
