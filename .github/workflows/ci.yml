name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages · typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present

  web:
    name: web · production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace=@fused-ai/web

  contracts:
    name: contracts · OpenLaunch core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Unit tests
        working-directory: contracts
        run: forge test --match-path "test/unit/*.t.sol" -vv
      # live-fork / rug suites need RPC (`FORK_TESTS=true`); do not delete them to go green
