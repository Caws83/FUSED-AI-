services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fused
      POSTGRES_PASSWORD: fused
      POSTGRES_DB: fused_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fused -d fused_ai"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - fused_pg:/var/lib/postgresql/data

volumes:
  fused_pg:
